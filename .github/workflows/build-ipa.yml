name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cat > project.yml << 'EOF'
          name: NFCTools
          options:
            bundleIdPrefix: com.nfctools
          targets:
            NFCTools:
              type: application
              platform: iOS
              sources: [NFC Tools]
              entitlements:
                path: NFC Tools/NFCTools.entitlements
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.nfctools.app
                  MARKETING_VERSION: 1.0.0
                  CURRENT_PROJECT_VERSION: 1
                  SWIFT_VERSION: 5.9
                  TARGETED_DEVICE_FAMILY: "1"
                  INFOPLIST_KEY_NFCReaderUsageDescription: Приложение использует NFC для чтения и записи меток.
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
          EOF
          xcodegen

      - name: Build unsigned app
        run: |
          xcodebuild -project NFCTools.xcodeproj -scheme NFCTools -configuration Release -sdk iphoneos -derivedDataPath dd CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" build

      - name: Package IPA
        run: |
          APP=$(find dd/Build/Products/Release-iphoneos -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r NFCTools-unsigned.ipa Payload
          mkdir -p artifact
          mv NFCTools-unsigned.ipa artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFCTools-unsigned-ipa
          path: artifact/NFCTools-unsigned.ipa
